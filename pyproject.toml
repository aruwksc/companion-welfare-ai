[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-welfare-ai"
version = "0.1.0"
description = "Local desktop prototype for companion-animal welfare monitoring"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
cwa-hello = "companion_welfare_ai.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
